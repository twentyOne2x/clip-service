name: Knowledge Base Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knowledge-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate required docs
        run: python3 scripts/knowledge_check.py
